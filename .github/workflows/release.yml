# Release_Pipeline for the Microservice Scaffold (Requirement 11).
#
# Builds both shipped Container configurations (Generic + Specific) on every
# push to main, on semver tags, on pull requests targeting main, and on manual
# dispatch. Pull-request runs build but do not publish (R11.7); every other
# trigger publishes to GHCR (R11.4/R11.5). Authentication uses the
# workflow-provided GITHUB_TOKEN with the minimum permissions (R11.6).
#
# The build does NOT use the `Dockerfile.template` source directly. Each matrix
# leg first runs scripts/emit-effective-dockerfile.sh, which writes `Dockerfile`
# = the `Dockerfile.template` source plus one `ENV MICROSERVICE_<X>_ENABLED=enabled`
# line per identifier in that leg's selector (R6.6). docker/build-push-action then
# builds that generated `Dockerfile` (its default file). The script is
# dependency-free POSIX sh, so no Node setup and no `npm ci` are needed before the
# build.
#
# The image-tree assembler (`buildImageTree` in packages/build-tools) verifies
# at build time that no unselected microservice leaked into the staged tree, so
# there is no post-build CI assertion needed — a selector mismatch fails the
# build itself, identically in local and CI builds.

name: release

# R11.2: pushes to main, semver tags v*.*.*, PRs targeting main, manual dispatch.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# R11.6: minimum permissions required to publish to GHCR with GITHUB_TOKEN.
# id-token: write enables OIDC federation for any downstream federated auth.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # R11.8: a non-zero step fails the run; do not let one matrix leg's failure
    # cancel the other, so both configurations are always attempted.
    strategy:
      fail-fast: false
      # R6.5 / R11.3: the two shipped Container configurations.
      #
      # No toggle flags are carried per leg: the image is built from the
      # generated `Dockerfile`, which bakes `MICROSERVICE_<X>_ENABLED=enabled`
      # for exactly the identifiers in that leg's selector (R6.6). The Overseer
      # therefore boots with no `-e` flags at all, and a deploy-time `-e` still
      # overrides a baked default when an operator wants a service off.
      matrix:
        include:
          - variant: generic
            selector: "*"
            image_suffix: generic
          - variant: specific
            selector: "microservice1,microservice2"
            image_suffix: microservice1-microservice2
    steps:
      - name: Checkout
        continue-on-error: false
        uses: actions/checkout@v7

      - name: Create builder
        continue-on-error: false
        run: docker buildx create --name mybuilder --use --bootstrap

      # R11.6: authenticate to GHCR with the workflow-provided token.
      - name: Log in to GHCR
        continue-on-error: false
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # R11.4/R11.5: compute the image name (owner/repo-<suffix>, lowercased by
      # metadata-action) and the tag set.
      - name: Compute image metadata
        id: meta
        continue-on-error: false
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.image_suffix }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # R6.6: generate `Dockerfile` for this leg's selector from
      # `Dockerfile.template` — the template with one default-toggle ENV line per
      # resolved identifier, injected before the runtime stage's ENTRYPOINT. The
      # script is dependency-free POSIX sh + awk, so this runs straight after
      # checkout with no `actions/setup-node` and no `npm ci`.
      #
      # R11.9: also records the exact selector used for this image in the logs
      # (the script echoes it too, and the generated file's header names it).
      - name: Generate Dockerfile
        continue-on-error: false
        env:
          MICROSERVICES: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          echo "MICROSERVICES=${MICROSERVICES}"
          sh scripts/emit-effective-dockerfile.sh
          echo "--- Dockerfile toggle defaults ---"
          grep -E '^ENV MICROSERVICE_[A-Z0-9_]+_ENABLED=' Dockerfile

      # R11.3/R11.7: always build the multi-arch image; publish only when not a
      # pull request. The image-tree assembler's own integrity check verifies at
      # build time that no unselected microservice leaked into the staged tree,
      # so there is no post-build assertion step.
      - name: Build and push (multi-arch)
        id: build
        continue-on-error: false
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            MICROSERVICES=${{ matrix.selector }}
            NODE_VERSION=22
            ALPINE_VERSION=3.21
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Prune old untagged GHCR versions after a successful publish. This repo
  # publishes two image names (one per matrix leg suffix), so both are cleaned.
  cleanup:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune old GHCR versions (generic image)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}-generic
          keep-n-untagged: 10

      - name: Prune old GHCR versions (specific image)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}-microservice1-microservice2
          keep-n-untagged: 10
